name: ASP.NET Core Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./SecureShop/SecureShop.csproj

      - name: Build
        run: dotnet build ./SecureShop/SecureShop.csproj --configuration Release --no-restore